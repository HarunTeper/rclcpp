services:
  lyrical:
    build: { context: ., dockerfile: lyrical/Dockerfile }
    image: mte-starvation/lyrical
    volumes:
      - ../:/ws/src/rclcpp_fork:ro
      - lyrical-build:/ws/build
      - lyrical-install:/ws/install
    working_dir: /ws
    # The rclcpp package sits at /ws/src/rclcpp_fork/rclcpp; symlink it in at runtime.
    command: bash
  humble:
    build: { context: ., dockerfile: humble/Dockerfile }
    image: mte-starvation/humble
    volumes:
      - ../:/ws/src/rclcpp_fork:ro
      - humble-build:/ws/build
      - humble-install:/ws/install
    working_dir: /ws
    command: bash
  jazzy:
    build: { context: ., dockerfile: jazzy/Dockerfile }
    image: mte-starvation/jazzy
    volumes:
      - ../:/ws/src/rclcpp_fork:ro
      - jazzy-build:/ws/build
      - jazzy-install:/ws/install
    working_dir: /ws
    command: bash
  # Autoware reference-system macro-benchmark (Phase 5.2). Builds fixed rclcpp +
  # ros-realtime/reference-system with an added EventsCBGExecutor variant. ROS_DISTRO
  # must be wait_result_ era (EventsCBGExecutor exists): jazzy (default) or lyrical.
  # Override distro: `docker compose build --build-arg ROS_DISTRO=lyrical autoware`.
  autoware:
    build:
      context: .
      dockerfile: autoware/Dockerfile
      args:
        ROS_DISTRO: jazzy
    image: mte-starvation/autoware-jazzy
    environment:
      ROS_DISTRO: jazzy
    volumes:
      - ../:/ws/src/rclcpp_fork:ro
      - autoware-build:/ws/build
      - autoware-install:/ws/install
    working_dir: /ws
    command: bash
volumes:
  lyrical-build:
  lyrical-install:
  humble-build:
  humble-install:
  jazzy-build:
  jazzy-install:
  autoware-build:
  autoware-install:
